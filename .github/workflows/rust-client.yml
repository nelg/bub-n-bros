name: rust-client

# Builds the three downloads of a release, attached to the workflow run as
# artifacts and, when a v* tag is pushed, to the GitHub release:
#   bubbros-native-VERSION           the game for the system's Python
#   bubbros-server-embedded-TARGET   the game server as one executable with
#                                    its own Python (PyInstaller), for
#                                    Linux, Windows and macOS
#   bubbros-play-alone-TARGET        the native client (Rust) with that
#                                    server built in

on:
  push:
    paths:
      - 'bub-n-bros/rust-client/**'
      - 'bub-n-bros/packing/pyinstaller/**'
      - 'bub-n-bros/bubbob/**'
      - 'bub-n-bros/common/**'
      - 'bub-n-bros/http2/**'
      - 'bub-n-bros/display/**'
      - '.github/workflows/rust-client.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'bub-n-bros/rust-client/**'
      - 'bub-n-bros/packing/pyinstaller/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: bubnbros-client
            server: bubnbros-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: bubnbros-client.exe
            server: bubnbros-server.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: bubnbros-client
            server: bubnbros-server
          - os: macos-13
            target: x86_64-apple-darwin
            binary: bubnbros-client
            server: bubnbros-server
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bub-n-bros/rust-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build the game server with PyInstaller
        working-directory: bub-n-bros
        run: |
          python -m pip install pyinstaller
          python packing/pyinstaller/build_server.py
      - name: Test the game server
        working-directory: bub-n-bros
        run: python packing/pyinstaller/smoke_test.py packing/pyinstaller/dist/${{ matrix.server }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - name: Test
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          export BUBNBROS_SERVER_BINARY="$GITHUB_WORKSPACE/bub-n-bros/packing/pyinstaller/dist/${{ matrix.server }}"
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          # play-alone: the native client with the game server built in
          name=bubbros-play-alone-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/$name/
          cp README.md dist/$name/
          # server-embedded: the game server on its own (PyInstaller)
          srv=bubbros-server-embedded-${{ matrix.target }}
          mkdir -p dist/$srv
          cp ../packing/pyinstaller/dist/${{ matrix.server }} dist/$srv/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a $name.zip $name; 7z a $srv.zip $srv
          else
            tar czf $name.tar.gz $name; tar czf $srv.tar.gz $srv
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bubbros-${{ matrix.target }}
          path: |
            bub-n-bros/rust-client/dist/bubbros-play-alone-*.*
            bub-n-bros/rust-client/dist/bubbros-server-embedded-*.*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bub-n-bros/rust-client/dist/bubbros-play-alone-*.*
            bub-n-bros/rust-client/dist/bubbros-server-embedded-*.*

  # native: the game for the system's Python (all platforms), with the
  # coloured images already generated
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Package
        run: |
          version=$(cat bub-n-bros/VERSION)
          name=bubbros-native-$version
          mkdir -p dist/$name
          git archive HEAD bub-n-bros | tar -x -C dist/$name --strip-components=1
          rm -rf dist/$name/rust-client dist/$name/debian dist/$name/packing
          (cd dist/$name/bubbob/images && python buildcolors.py)
          cd dist
          tar czf $name.tar.gz $name
          zip -qr $name.zip $name
      - uses: actions/upload-artifact@v4
        with:
          name: bubbros-native
          path: dist/bubbros-native-*.*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bubbros-native-*.*
