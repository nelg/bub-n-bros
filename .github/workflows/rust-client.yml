name: rust-client

# Builds the three downloads of a release, attached to the workflow run as
# artifacts and, when a v* tag is pushed, to the GitHub release:
#   bubbros-python-VERSION           the game for the system's Python
#   bubbros-server-portable-TARGET   the game server as one executable with
#                                    its own Python (PyInstaller), for
#                                    Linux, Windows and macOS
#   bubbros-portable-TARGET          the Rust client with that server
#                                    built in: one file, no Python needed

on:
  push:
    paths:
      - 'bub-n-bros/rust-client/**'
      - 'bub-n-bros/packing/pyinstaller/**'
      - 'bub-n-bros/bubbob/**'
      - 'bub-n-bros/common/**'
      - 'bub-n-bros/http2/**'
      - 'bub-n-bros/display/**'
      - '.github/workflows/rust-client.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'bub-n-bros/rust-client/**'
      - 'bub-n-bros/packing/pyinstaller/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: bubbros-client
            server: bubnbros-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: bubbros-client.exe
            server: bubnbros-server.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: bubbros-client
            server: bubnbros-server
          - os: macos-13
            target: x86_64-apple-darwin
            binary: bubbros-client
            server: bubnbros-server
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bub-n-bros/rust-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Linux: not with setup-python's Python, which is compiled for
      # newer processors (it needs BMI2: "illegal instruction" on CPUs
      # before Intel Haswell / AMD Excavator).  The Docker python image is
      # built for any x86-64 and links against an older glibc (Debian 12).
      - name: Build the game server with PyInstaller (Linux)
        if: runner.os == 'Linux'
        working-directory: bub-n-bros
        run: |
          docker run --rm -v "$PWD:/src" -w /src -u "$(id -u):$(id -g)" \
            -e HOME=/tmp python:3.14-bookworm sh -c '
              python -m pip install --quiet --user pyinstaller &&
              # refuse a Python that uses BMI2 instructions
              ! objdump -d /usr/local/lib/libpython3*.so.1.0 | grep -qE "\b(rorx|shlx|shrx|sarx)" &&
              python packing/pyinstaller/build_server.py --rust-client-only'
      - name: Build the game server with PyInstaller
        if: runner.os != 'Linux'
        working-directory: bub-n-bros
        run: |
          python -m pip install pyinstaller
          python packing/pyinstaller/build_server.py --rust-client-only
      - name: Test the game server
        working-directory: bub-n-bros
        run: python packing/pyinstaller/smoke_test.py packing/pyinstaller/dist/${{ matrix.server }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - name: Test
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          export BUBNBROS_SERVER_BINARY="$GITHUB_WORKSPACE/bub-n-bros/packing/pyinstaller/dist/${{ matrix.server }}"
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          # portable: the Rust client with the game server built in
          name=bubbros-portable-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/$name/
          cp README.md dist/$name/
          # server-portable: the game server on its own (PyInstaller)
          srv=bubbros-server-portable-${{ matrix.target }}
          mkdir -p dist/$srv
          cp ../packing/pyinstaller/dist/${{ matrix.server }} dist/$srv/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a $name.zip $name; 7z a $srv.zip $srv
          else
            tar czf $name.tar.gz $name; tar czf $srv.tar.gz $srv
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bubbros-${{ matrix.target }}
          path: |
            bub-n-bros/rust-client/dist/bubbros-portable-*.*
            bub-n-bros/rust-client/dist/bubbros-server-portable-*.*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bub-n-bros/rust-client/dist/bubbros-portable-*.*
            bub-n-bros/rust-client/dist/bubbros-server-portable-*.*

  # python: the game for the system's Python (all platforms), with the
  # coloured images already generated
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Package
        run: |
          version=$(cat bub-n-bros/VERSION)
          name=bubbros-python-$version
          mkdir -p dist/$name
          git archive HEAD bub-n-bros | tar -x -C dist/$name --strip-components=1
          rm -rf dist/$name/rust-client dist/$name/debian dist/$name/packing
          (cd dist/$name/bubbob/images && python buildcolors.py)
          cd dist
          tar czf $name.tar.gz $name
          zip -qr $name.zip $name
      - uses: actions/upload-artifact@v4
        with:
          name: bubbros-python
          path: dist/bubbros-python-*.*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bubbros-python-*.*
