name: rust-client

# Builds the native client (bub-n-bros/rust-client) for Linux, Windows
# and macOS.  The binaries are attached to the workflow run as artifacts,
# and to the GitHub release when a v* tag is pushed.

on:
  push:
    paths:
      - 'bub-n-bros/rust-client/**'
      - '.github/workflows/rust-client.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'bub-n-bros/rust-client/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: bubnbros-client
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: bubnbros-client.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: bubnbros-client
          - os: macos-13
            target: x86_64-apple-darwin
            binary: bubnbros-client
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bub-n-bros/rust-client
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - name: Test
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=bubnbros-client-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/$name/
          cp README.md dist/$name/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a $name.zip $name; else tar czf $name.tar.gz $name; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bubnbros-client-${{ matrix.target }}
          path: bub-n-bros/rust-client/dist/bubnbros-client-*.*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bub-n-bros/rust-client/dist/bubnbros-client-*.*
