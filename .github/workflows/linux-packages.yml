name: linux-packages

# Builds the Linux distribution packages from bub-n-bros/debian
# (Debian, Ubuntu) and bub-n-bros/packing/rpm/bubbros.spec (Fedora,
# OpenMandriva), installs each one and checks that the programs start.
# The packages are attached to the workflow run as artifacts, and to the
# GitHub release when a v* tag is pushed.

on:
  push:
    paths:
      - 'bub-n-bros/debian/**'
      - 'bub-n-bros/packing/linux/**'
      - 'bub-n-bros/packing/rpm/**'
      - '.github/workflows/linux-packages.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:trixie']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools and dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            devscripts equivs build-essential ca-certificates
          cd bub-n-bros
          mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
      - name: Build
        working-directory: bub-n-bros
        run: dpkg-buildpackage -us -uc -b
      - name: Install and check
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./bubbros_*.deb
          bubbros-native --help | grep -q 'native client'
          python3 -c "import sys; sys.path.insert(0, '/usr/share/bubbros'); import common.msgstruct, display.pclient"
          dpkg -L bubbros | grep -E '^/usr/(bin|lib)/'
      - name: Name the package after the distribution
        id: name
        run: echo "tag=$(echo '${{ matrix.image }}' | tr ':' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bubbros-${{ steps.name.outputs.tag }}
          path: bubbros_*.deb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          apt-get install -y gh || true
          for f in bubbros_*.deb; do
            cp "$f" "${f%.deb}-${{ steps.name.outputs.tag }}.deb"
          done
          gh release upload "${GITHUB_REF_NAME}" bubbros_*-${{ steps.name.outputs.tag }}.deb \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 'fedora:latest'
            tag: fedora
            optional: false
          - image: 'openmandriva/cooker:latest'
            tag: openmandriva
            optional: true
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - name: Install the build tools
        run: dnf install -y git rpm-build 'dnf-command(builddep)' tar gzip
      - uses: actions/checkout@v4
      - name: Install the build dependencies
        run: dnf builddep -y bub-n-bros/packing/rpm/bubbros.spec
      - name: Make the source tarball
        run: |
          git config --global --add safe.directory "$PWD"
          version=$(cat bub-n-bros/VERSION)
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix=bub-n-bros-$version/ \
            -o ~/rpmbuild/SOURCES/bub-n-bros-$version.tar.gz HEAD
      - name: Build
        run: rpmbuild -bb bub-n-bros/packing/rpm/bubbros.spec
      - name: Install and check
        run: |
          dnf install -y $(ls ~/rpmbuild/RPMS/*/bubbros-[0-9]*.rpm)
          bubbros-native --help | grep -q 'native client'
          python3 -c "import sys; sys.path.insert(0, '/usr/share/bubbros'); import common.msgstruct, display.pclient"
          rpm -ql bubbros | grep -E '^/usr/(bin|lib)/'
          mkdir -p dist && cp ~/rpmbuild/RPMS/*/bubbros-[0-9]*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bubbros-${{ matrix.tag }}
          path: dist/*.rpm
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          dnf install -y gh || exit 0
          gh release upload "${GITHUB_REF_NAME}" dist/*.rpm --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
