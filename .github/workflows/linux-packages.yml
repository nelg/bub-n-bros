name: linux-packages

# Builds the Linux distribution packages from bub-n-bros/debian (Debian,
# Ubuntu) and bub-n-bros/packing/rpm/bubbros.spec (Fedora, OpenMandriva):
# bubbros-native, bubbros-server-embedded and bubbros-play-alone, which
# conflict with each other.  Each one is installed (in turn) and checked.
# The packages are attached to the workflow run as artifacts, and to the
# GitHub release when a v* tag is pushed.

on:
  push:
    paths:
      - 'bub-n-bros/debian/**'
      - 'bub-n-bros/packing/**'
      - '.github/workflows/linux-packages.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:trixie']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools and dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            devscripts equivs build-essential ca-certificates
          cd bub-n-bros
          mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
      - name: Build
        working-directory: bub-n-bros
        run: dpkg-buildpackage -us -uc -b
      - name: Install and check each package
        run: |
          export DEBIAN_FRONTEND=noninteractive
          smoke=bub-n-bros/packing/pyinstaller/smoke_test.py
          apt-get install -y ./bubbros-native_*.deb
          bubbros-native --help > /tmp/help.txt && grep -q 'native client' /tmp/help.txt
          python3 -c "import sys; sys.path.insert(0, '/usr/share/bubbros'); import common.msgstruct, display.pclient"
          python3 $smoke --level=/usr/share/bubbros/bubbob/levels/Arena.bin bubnbros-server
          # the packages conflict: installing one removes the other
          apt-get install -y ./bubbros-server-embedded_*.deb
          test ! -e /usr/share/bubbros
          python3 $smoke bubnbros-server
          bubbros-native --help > /tmp/help.txt && grep -q 'native client' /tmp/help.txt
          apt-get install -y ./bubbros-play-alone_*.deb
          test ! -e /usr/bin/bubnbros-server
          bubbros-native --help > /tmp/help.txt && grep -q 'native client' /tmp/help.txt
      - name: Name the packages after the distribution
        id: name
        run: |
          tag=$(echo '${{ matrix.image }}' | tr ':' '-')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          for f in bubbros-*.deb; do cp "$f" "dist/${f%.deb}-$tag.deb"; done
      - uses: actions/upload-artifact@v4
        with:
          name: bubbros-${{ steps.name.outputs.tag }}
          path: dist/*.deb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb

  rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 'fedora:latest'
            tag: fedora
            optional: false
          - image: 'openmandriva/cooker:latest'
            tag: openmandriva
            optional: true
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - name: Install the build tools
        run: dnf install -y git rpm-build 'dnf-command(builddep)' tar gzip
      - uses: actions/checkout@v4
      - name: Install the build dependencies
        run: |
          for v in native server-embedded play-alone; do
            dnf builddep -y --define "variant $v" bub-n-bros/packing/rpm/bubbros.spec
          done
      - name: Make the source tarball
        run: |
          git config --global --add safe.directory "$PWD"
          version=$(cat bub-n-bros/VERSION)
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix=bub-n-bros-$version/ \
            -o ~/rpmbuild/SOURCES/bub-n-bros-$version.tar.gz HEAD
      - name: Build
        run: |
          for v in native server-embedded play-alone; do
            rpmbuild -bb --define "variant $v" bub-n-bros/packing/rpm/bubbros.spec
          done
      - name: Install and check each package
        run: |
          smoke=bub-n-bros/packing/pyinstaller/smoke_test.py
          rpms=~/rpmbuild/RPMS/x86_64
          dnf install -y $rpms/bubbros-native-2*.rpm
          bubbros-native --help > /tmp/help.txt && grep -q 'native client' /tmp/help.txt
          python3 -c "import sys; sys.path.insert(0, '/usr/share/bubbros'); import common.msgstruct, display.pclient"
          python3 $smoke --level=/usr/share/bubbros/bubbob/levels/Arena.bin bubnbros-server
          dnf remove -y bubbros-native
          dnf install -y $rpms/bubbros-server-embedded-2*.rpm
          python3 $smoke bubnbros-server
          bubbros-native --help > /tmp/help.txt && grep -q 'native client' /tmp/help.txt
          dnf remove -y bubbros-server-embedded
          dnf install -y $rpms/bubbros-play-alone-2*.rpm
          bubbros-native --help > /tmp/help.txt && grep -q 'native client' /tmp/help.txt
          mkdir -p dist
          for f in $rpms/bubbros-*-2*.rpm; do
            b=$(basename "$f" .rpm); cp "$f" "dist/$b.${{ matrix.tag }}.rpm"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bubbros-${{ matrix.tag }}
          path: dist/*.rpm
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
