[package]
name = "bubnbros-client"
version = "2.0.0"
edition = "2021"
description = "Native client for The Bub's Brothers game server"
license = "MIT"

[[bin]]
name = "bubnbros-client"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4", default-features = false, features = ["audio"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md-5 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# quad-snd with a fix for Linux systems using PulseAudio (see vendor/quad-snd)
[patch.crates-io]
quad-snd = { path = "vendor/quad-snd" }
